# Conda/mamba environment for NuclearMatter-Backend + external validation refs.
#
#   mamba env create -f env/environment.yml      # (or conda)
#   conda activate nmbackend-validate
#   pip install -e .
#   PYTHONPATH=src pytest
#
# RePrimAnd's Python interface: PyPI distribution is named "reprimand" (the import
# module is "pyreprimand"); a binary wheel exists for Linux, so `pip install
# reprimand` works there.  On macOS/HPC build from source with the meson/ninja/
# boost/gsl/hdf5/pybind11 deps below.  See docs/environment.md.
name: nmbackend-validate
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24,<2.3
  - scipy>=1.10
  - jax>=0.4.20
  - jaxlib>=0.4.20
  - diffrax>=0.5
  - equinox>=0.11
  - pyyaml>=5.0
  - h5py
  - matplotlib
  - corner
  - pytest
  # --- external reference: RIFT (its EOSManager has the (old) RePrimAnd wiring) ---
  - lalsuite=7.25
  # --- build deps for RePrimAnd / pyreprimand from source ---
  - meson
  - ninja
  - pybind11
  - boost-cpp
  - gsl
  - hdf5
  - cxx-compiler
  - pip:
      # Linux binary wheel available. On macOS/HPC remove this line and build from
      # source (docs/environment.md); the build deps above are already provided.
      - reprimand     # PyPI distribution name; import as `pyreprimand`
